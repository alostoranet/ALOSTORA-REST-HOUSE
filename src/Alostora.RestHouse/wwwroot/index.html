<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استراحة الأسطورة نت</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1727;color:#f5f7fb;font-family:Tahoma,Arial}header{background:#142d4a;padding:25px 5%;border-bottom:3px solid #c93640}h1{margin:0;font-size:27px}header p{color:#d4e3f1;margin:8px 0 0}main{max-width:1150px;margin:auto;padding:24px}h2{font-size:22px}#library{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.movie{background:#1a2b40;border:1px solid #2c4058;border-radius:13px;padding:16px;min-width:0}.movie h3{overflow-wrap:anywhere;font-size:17px;min-height:42px}.movie button{background:#c93640;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font-weight:bold}video{width:100%;max-height:65vh;background:#000;border-radius:12px;margin-top:22px}#message{color:#bdcadd}</style></head><body><header><h1>ALOSTORA REST HOUSE</h1><p>استراحة الأسطورة نت — مكتبة المشاهدة</p></header><main><h2>مكتبة الأفلام</h2><p id="message">يتم تحميل المكتبة...</p><section id="library"></section><video id="player" controls playsinline preload="metadata"></video></main><script>const viewerId=localStorage.getItem('alostora-viewer')||(()=>{const id=crypto.randomUUID();localStorage.setItem('alostora-viewer',id);return id;})();let activeVideo=null;let saveTimer=null;const player=document.querySelector('#player');async function saveProgress(){if(!activeVideo||!Number.isFinite(player.currentTime))return;try{await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({viewerId,videoId:activeVideo.id,positionSeconds:player.currentTime,durationSeconds:Number.isFinite(player.duration)?player.duration:0})});}catch{}}player.addEventListener('timeupdate',()=>{if(!saveTimer)saveTimer=setTimeout(()=>{saveTimer=null;saveProgress();},10000);});player.addEventListener('pause',saveProgress);player.addEventListener('ended',()=>{saveProgress();});async function load(){const box=document.querySelector('#library'),msg=document.querySelector('#message');try{const res=await fetch('/api/library');if(!res.ok)throw Error();const items=await res.json();box.replaceChildren();msg.textContent=items.length?`عدد الفيديوهات: ${items.length}`:'المكتبة فارغة حالياً. أضف ملفات فيديو إلى مجلد المكتبة.';for(const item of items){const card=document.createElement('article');card.className='movie';const title=document.createElement('h3');title.textContent=item.title;const btn=document.createElement('button');btn.textContent='شاهد الآن';btn.onclick=async()=>{activeVideo=item;player.src=item.url;try{const r=await fetch('/api/progress/'+encodeURIComponent(viewerId));const rows=await r.json();const saved=rows.find(x=>x.videoId===item.id);player.onloadedmetadata=()=>{if(saved&&saved.positionSeconds>5&&saved.positionSeconds<player.duration-10)player.currentTime=saved.positionSeconds;player.play().catch(()=>{});};}catch{player.play().catch(()=>{});}player.scrollIntoView({behavior:'smooth'});};card.append(title,btn);box.append(card);}}catch{msg.textContent='تعذر الاتصال بالسيرفر.';}}load();</script></body></html>
