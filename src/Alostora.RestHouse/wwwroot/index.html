<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>استراحة الأسطورة نت</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1727;color:#f5f7fb;font-family:Tahoma,Arial}
header{background:#142d4a;padding:25px 5%;border-bottom:3px solid #c93640}h1{margin:0;font-size:27px}header p{color:#d4e3f1;margin:8px 0 0}
main{max-width:1150px;margin:auto;padding:24px}h2{font-size:22px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select{background:#172a40;color:#fff;border:1px solid #38516d;border-radius:9px;padding:12px;font:inherit;min-width:180px}
#library{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.movie{background:#1a2b40;border:1px solid #2c4058;border-radius:13px;padding:16px;min-width:0}.movie .poster{display:block;width:100%;height:245px;object-fit:cover;border-radius:9px;background:#0b1420;margin-bottom:10px}.movie h3{overflow-wrap:anywhere;font-size:17px;margin:8px 0}.movie p{color:#c4d2e1;font-size:13px;line-height:1.7;margin:8px 0}
.meta{font-size:12px;color:#e5b6b9;margin:5px 0 12px}.movie button{background:#c93640;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font-weight:bold}
video{width:100%;max-height:65vh;background:#000;border-radius:12px;margin-top:22px}#message{color:#bdcadd}
</style></head><body>
<header><h1>ALOSTORA REST HOUSE</h1><p>استراحة الأسطورة نت — مكتبة المشاهدة</p></header>
<main><h2>مكتبة الأفلام والمسلسلات</h2>
<div class="toolbar"><input id="search" type="search" placeholder="ابحث عن فيلم أو مسلسل..."><select id="kind"><option value="">كل المحتوى</option><option value="Movie">أفلام</option><option value="Series">مسلسلات</option></select><select id="genre"><option value="">كل التصنيفات</option></select></div>
<p id="message">يتم تحميل المكتبة...</p><section id="library"></section><video id="player" controls playsinline preload="metadata"></video></main>
<script>
const viewerId=localStorage.getItem('alostora-viewer')||(()=>{const id=crypto.randomUUID();localStorage.setItem('alostora-viewer',id);return id;})();
let activeVideo=null,items=[];let saveTimer=null;const player=document.querySelector('#player');
async function saveProgress(){if(!activeVideo||!Number.isFinite(player.currentTime))return;try{await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({viewerId,videoId:activeVideo.id,positionSeconds:player.currentTime,durationSeconds:Number.isFinite(player.duration)?player.duration:0})});}catch{}}
player.addEventListener('timeupdate',()=>{if(!saveTimer)saveTimer=setTimeout(()=>{saveTimer=null;saveProgress();},10000);});player.addEventListener('pause',saveProgress);player.addEventListener('ended',saveProgress);
function render(){const box=document.querySelector('#library'),msg=document.querySelector('#message'),q=document.querySelector('#search').value.trim().toLocaleLowerCase('ar'),kind=document.querySelector('#kind').value,genre=document.querySelector('#genre').value;
const filtered=items.filter(x=>(!kind||x.kind===kind)&&(!genre||x.genre===genre)&&[x.title,x.description,x.genre].join(' ').toLocaleLowerCase('ar').includes(q));
box.replaceChildren();msg.textContent=filtered.length?'عدد النتائج: '+filtered.length:(items.length?'لا توجد نتائج مطابقة.':'المكتبة فارغة حالياً. أضف ملفات فيديو إلى مجلد المكتبة.');
for(const item of filtered){const card=document.createElement('article');card.className='movie';if(item.posterPath){const poster=document.createElement('img');poster.className='poster';poster.src=item.posterPath;poster.alt='غلاف '+item.title;poster.loading='lazy';card.append(poster);}const title=document.createElement('h3');title.textContent=item.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=[item.kind==='Series'?'مسلسل':'فيلم',item.year,item.genre].filter(Boolean).join(' • ');const desc=document.createElement('p');desc.textContent=item.description||'لا يوجد وصف لهذا العمل بعد.';const btn=document.createElement('button');btn.textContent='شاهد الآن';btn.onclick=()=>play(item);card.append(title,meta,desc,btn);box.append(card);}}
async function play(item){activeVideo=item;player.src=item.url;try{const r=await fetch('/api/progress/'+encodeURIComponent(viewerId));const rows=await r.json();const saved=rows.find(x=>x.videoId===item.id);player.onloadedmetadata=()=>{if(saved&&saved.positionSeconds>5&&saved.positionSeconds<player.duration-10)player.currentTime=saved.positionSeconds;player.play().catch(()=>{});};}catch{player.play().catch(()=>{});}player.scrollIntoView({behavior:'smooth'});}
async function load(){try{const res=await fetch('/api/library');if(!res.ok)throw Error();items=await res.json();const genres=[...new Set(items.map(x=>x.genre).filter(Boolean))].sort();const select=document.querySelector('#genre');for(const g of genres){const o=document.createElement('option');o.value=g;o.textContent=g;select.append(o);}render();}catch{document.querySelector('#message').textContent='تعذر الاتصال بالسيرفر.';}}
for(const id of ['search','kind','genre'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);load();
</script></body></html>
