name: Build Windows
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        run: dotnet publish src/Alostora.RestHouse/Alostora.RestHouse.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ALOSTORA-REST-HOUSE-Windows-x64
          path: publish/**
          if-no-files-found: error
