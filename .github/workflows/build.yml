name: Build Windows application

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Alostora.RestHouse/Alostora.RestHouse.csproj

      - name: Build
        run: dotnet build src/Alostora.RestHouse/Alostora.RestHouse.csproj --configuration Release --no-restore
