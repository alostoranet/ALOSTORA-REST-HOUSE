name: Build Windows application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows x64 dependencies
        run: dotnet restore src/Alostora.RestHouse/Alostora.RestHouse.csproj --runtime win-x64

      - name: Validate UI wiring, API routes, and viewer scripts
        shell: pwsh
        run: ./scripts/validate-project.ps1

      - name: Restore SQLite test dependencies
        run: dotnet restore tests/Alostora.RestHouse.Tests/Alostora.RestHouse.Tests.csproj --runtime win-x64

      - name: Run SQLite publication and catalog tests
        run: dotnet test tests/Alostora.RestHouse.Tests/Alostora.RestHouse.Tests.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Build
        run: dotnet build src/Alostora.RestHouse/Alostora.RestHouse.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Load the WPF management window (STA smoke test)
        run: dotnet run --project tests/Alostora.RestHouse.WpfSmokeTest/Alostora.RestHouse.WpfSmokeTest.csproj --configuration Release --runtime win-x64

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/Alostora.RestHouse/Alostora.RestHouse.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-output | Out-Null
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" installer/ALOSTORA-REST-HOUSE.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload single-file Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ALOSTORA-REST-HOUSE-Installer
          path: installer-output/ALOSTORA-REST-HOUSE-Setup.exe
          if-no-files-found: error
          retention-days: 14
